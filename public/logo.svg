<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee0979;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <text x="250" y="110" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="85" text-anchor="middle" fill="url(#logoGradient)" style="filter:url(#glow); letter-spacing: -2px;">
    GEN<tspan dx="-2">z</tspan>AI
  </text>
  
  <!-- Stylized Star in 'A' -->
  <path d="M405 85 L408 95 L418 98 L408 101 L405 111 L402 101 L392 98 L402 95 Z" fill="white" style="filter:url(#glow);" />
  
  <text x="250" y="160" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="14" text-anchor="middle" fill="#00f2fe" style="letter-spacing: 5px; opacity: 0.8;">
    GENERATE <tspan fill="#ee0979">•</tspan> ENABLE <tspan fill="#ee0979">•</tspan> INSPIRE
  </text>
</svg>
